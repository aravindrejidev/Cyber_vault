name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned on purpose: every plugin used by this app is known to build with
      # the Android toolchain that Flutter 3.41 generates. To try a newer
      # Flutter, change the version below.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project
        run: |
          set -e
          flutter create . --platforms=android --org com.cybervault --project-name cyber_vault
          # The default widget test refers to a MyApp class that does not exist here.
          rm -rf test

      - name: Apply Android overlay
        run: |
          set -e
          cp -r android_overlay/. android/
          # Some plugins (flutter_secure_storage) need minSdk 23+.
          # maxOf keeps Flutter's own default if it is already higher.
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 24)/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = Math.max(flutter.minSdkVersion, 24)/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion Math.max(flutter.minSdkVersion, 24)/' android/app/build.gradle
          fi
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (informational)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cyber-vault-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload resolved dependency versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock
          if-no-files-found: ignore
