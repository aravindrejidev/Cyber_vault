name: Create signing key (run once)

# Creates the permanent key that signs every release and stores it in the
# repository secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
# Without ONE permanent key, Android refuses to install updates over the
# installed app. Needs the repository secret GH_PAT (see README).
# The key never appears in logs or artifacts.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      REPO: ${{ github.repository }}

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate the key and save it as repository secrets
        run: |
          set -e
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the repository secret GH_PAT first: a fine-grained token with 'Secrets: Read and write' for this repository (see README)."
            exit 1
          fi
          if gh secret list --repo "$REPO" | grep -q '^KEYSTORE_BASE64'; then
            echo "::error::A signing key already exists. Replacing it would make the installed app impossible to update."
            exit 1
          fi

          PASS=$(openssl rand -hex 24)
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storetype PKCS12 \
            -alias vault \
            -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Cyber Vault, O=Personal"

          base64 -w0 "$RUNNER_TEMP/release.jks" | gh secret set KEYSTORE_BASE64 --repo "$REPO"
          printf '%s' "$PASS" | gh secret set KEYSTORE_PASSWORD --repo "$REPO"
          printf '%s' "$PASS" | gh secret set KEY_PASSWORD --repo "$REPO"
          printf '%s' "vault" | gh secret set KEY_ALIAS --repo "$REPO"
          rm -f "$RUNNER_TEMP/release.jks"

          echo "Signing key saved to the repository secrets." >> "$GITHUB_STEP_SUMMARY"
          echo "Now delete the GH_PAT secret and revoke the token." >> "$GITHUB_STEP_SUMMARY"
