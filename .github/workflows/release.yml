name: Release APK

# Manual release:  Actions -> "Release APK" -> Run workflow
# Type the new version number (and, optionally, what's new / fixes).
# The signed APK is published as a GitHub Release; the app's updater reads it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version number, e.g. 1.0.1 (digits and dots only, higher than the last release)"
        required: true
        type: string
      new_features:
        description: "What's new (separate items with ;)"
        required: false
        type: string
        default: ""
      fixes:
        description: "Fixes (separate items with ;)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      VERSION: ${{ inputs.version }}
      NEW_FEATURES: ${{ inputs.new_features }}
      FIXES: ${{ inputs.fixes }}
      # Releases go to this repository unless the repository variable
      # RELEASE_REPO names another public repository (see README).
      RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
      GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the version number
        run: |
          set -e
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like 1.2.3 (digits and dots only)."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          if [ "$((10#$MAJOR))" -ge 2000 ] || [ "$((10#$MINOR))" -ge 1000 ] || [ "$((10#$PATCH))" -ge 1000 ]; then
            echo "::error::Major must be below 2000, minor and patch below 1000."
            exit 1
          fi
          NUMBER=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          echo "BUILD_NUMBER=$NUMBER" >> "$GITHUB_ENV"

          if gh release view "v$VERSION" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Use a higher version number."
            exit 1
          fi
          LAST_TAG=$(gh release view --repo "$RELEASE_REPO" --json tagName --jq '.tagName' 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            LAST="${LAST_TAG#v}"
            if [[ "$LAST" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              IFS=. read -r LMAJOR LMINOR LPATCH <<< "$LAST"
              LAST_NUMBER=$((10#$LMAJOR * 1000000 + 10#$LMINOR * 1000 + 10#$LPATCH))
              if [ "$NUMBER" -le "$LAST_NUMBER" ]; then
                echo "::error::v$VERSION is not higher than the latest release ($LAST_TAG)."
                exit 1
              fi
            fi
          fi
          echo "Releasing v$VERSION (build number $NUMBER) to $RELEASE_REPO"

      - name: Check that the signing key exists
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing key not found. Run the 'Create signing key' workflow once first (see README)."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned on purpose: every plugin used by this app is known to build with
      # the Android toolchain that Flutter 3.41 generates.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"
          cache: true

      - name: Generate Android project
        run: |
          set -e
          flutter create . --platforms=android --org com.cybervault --project-name cyber_vault
          # The default widget test refers to a MyApp class that does not exist here.
          rm -rf test

      - name: Apply Android overlay
        run: |
          set -e
          cp -r android_overlay/. android/
          # Some plugins (flutter_secure_storage) need minSdk 23+.
          # maxOf keeps Flutter's own default if it is already higher.
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 24)/' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = Math.max(flutter.minSdkVersion, 24)/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion Math.max(flutter.minSdkVersion, 24)/' android/app/build.gradle
          fi
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (informational)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: |
          set -e
          flutter build apk --release --no-shrink \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=APP_VERSION="$VERSION" \
            --dart-define=GITHUB_REPO="$RELEASE_REPO"

      # Android only installs an update over the existing app when both APKs are
      # signed with the SAME key, so the build is always re-signed with the
      # permanent key stored in the repository secrets.
      - name: Sign the APK with the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -n 1)
          echo "Using $APKSIGNER"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          mkdir -p dist
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "dist/cyber-vault-$VERSION.apk" \
            build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs "dist/cyber-vault-$VERSION.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          ls -l dist

      - name: Write the release notes
        run: |
          set -e
          format_items() {
            local raw="$1"
            local out=""
            local item
            local -a items
            IFS=';' read -ra items <<< "$raw"
            for item in "${items[@]}"; do
              item="$(printf '%s' "$item" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              if [ -n "$item" ]; then
                out+="• ${item}"$'\n'
              fi
            done
            if [ -z "$out" ]; then
              out="• None"$'\n'
            fi
            printf '%s' "$out"
          }
          {
            echo "New"
            format_items "$NEW_FEATURES"
            echo
            echo "Fixes"
            format_items "$FIXES"
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        run: |
          set -e
          TARGET_ARGS=()
          if [ "$RELEASE_REPO" = "$GITHUB_REPOSITORY" ]; then
            TARGET_ARGS=(--target "$GITHUB_SHA")
          fi
          gh release create "v$VERSION" "dist/cyber-vault-$VERSION.apk" \
            --repo "$RELEASE_REPO" \
            --title "Cyber Vault v$VERSION" \
            --notes-file release-notes.md \
            "${TARGET_ARGS[@]}"
          echo "Release published: https://github.com/$RELEASE_REPO/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the resolved dependency versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: pubspec.lock
          if-no-files-found: ignore
